# Render Blueprint for the API.
#
# The service already exists and was configured by hand in Render's dashboard, so this
# file describes it rather than being its source of truth. Reconcile it with the dashboard
# before applying as a Blueprint — applying a mismatched one would reconfigure a working
# service.
#
# The service runs the TypeScript directly via tsx, which is why tsx is a runtime
# dependency rather than a dev one: Render installs with NODE_ENV=production and can skip
# devDependencies. Running from source also sidesteps the fact that `node dist/index.js`
# cannot work as things stand — the API imports POEMS from @gedichtenv2/shared, which
# ships raw TypeScript, so Node fails on it at require time.
services:
  - type: web
    name: kov-cs-poetry
    runtime: node
    plan: free
    # Region is whatever the existing service uses — set it before applying.
    # region: frankfurt
    rootDir: .
    # No compile step: the service runs from source, so a build would only emit a dist
    # nothing loads. Type errors are caught by CI before merge instead.
    buildCommand: npm ci
    startCommand: npm start --workspace=packages/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Render injects PORT itself; the app already reads it.
      # Secrets stay dashboard-managed — sync: false means "required, value not in git".
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false

name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Builds main directly. This used to check out a separate main-hungarian branch and
      # poll until it contained main's HEAD, because the Hungarian site was once a branch.
      # It no longer is — the language lives in the i18n layer and lang="hu" on main — and
      # the two branches had become byte-identical, so the merge step and its wait only
      # created a window where a stale build could publish.
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build All Packages
        run: npx turbo run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Copy index.html to 404.html for SPA routing
        run: cp packages/web/dist/index.html packages/web/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'packages/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

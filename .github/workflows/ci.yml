name: CI

# Validates every push and pull request. Deploying used to be the only automation, so a
# commit that failed typecheck or lint reached main and was only caught by the deploy
# going red afterwards.
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    name: Layout tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Only Chromium: these are layout assertions against the one engine the site is
      # actually verified on, not a cross-browser matrix.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run layout tests
        run: npm run test:e2e

      # Surfaced on the run page so a failure can be read without digging into the raw log
      - name: Summarise failures
        if: failure()
        run: |
          {
            echo '### Layout test failures'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' test-results/*/error-context.md 2>/dev/null | head -80 \
              || echo 'no error context captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
